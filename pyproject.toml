[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ostrov-public-api"
version = "0.1.2"
description = "HTTP client and MCP adapter for the public Ostrov retreat API"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.urls]
Homepage = "https://ostrov.center/developers"
Repository = "https://github.com/iia-arg/ostrov-public-api"
Documentation = "https://ostrov.center/api/public/v1/openapi.json"

[project.scripts]
ostrov-mcp = "ostrov_api.mcp:main"

[tool.setuptools]
packages = ["ostrov_api"]

[tool.setuptools.package-data]
ostrov_api = ["tools.json"]
